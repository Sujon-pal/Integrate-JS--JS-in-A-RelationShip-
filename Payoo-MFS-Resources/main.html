<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- DaisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@3/dist/full.css"
      rel="stylesheet"
      type="text/css"
    />
  </head>

  <body class="bg-slate-900 min-h-screen">
    <!-- Main Section -->
    <section class="max-w-md min-h-screen mx-auto py-6 bg-slate-200">
      <!-- Header -->
      <header class="mx-3">
        <nav class="flex items-center justify-between">
          <div class="flex items-center justify-center">
            <img class="w-14" src="assets/Group.png" alt="" />

            <div>
              <h1 class="font-bold text-black text-xl">$ <span id="main-balance">500</span></h1>
              <p class="text-sm text-gray-600">Abailable Balance</p>
            </div>
          </div>
          <button
            class="border-2 border-gray-400 rounded-lg lg:py-2 lg:px-3 px-2 py-1 text-gray-500 font-semibold hover:text-blue-700 hover:border-blue-700"
          >
            LogOut
          </button>
        </nav>
        <!-- card Section -->
        <section class="mt-8">
          <h1 class="text-black text-xl font-bold">🔥Welcome to Payooo!</h1>
          <p class="text-gray-600 text-sm mt-3">
            Enjoy easy and convenient financial services with us. <br />
            Cashout charge is low and
          </p>
          <!-- Card -->
          <div class="card grid grid-cols-3 gap-4 mt-6">
            <!-- card-1  -->
            <div id="add-money-card"
              class="box border border-gray-500 p-3 flex flex-col items-center text-center rounded-lg shadow-lg hover:border-blue-600 hover:bg-white hover:shadow-xl transition duration-300 cursor-pointer"
            >
              <img class="w-8" src="assets/wallet1.png" alt="" />
              <p class="text-sm">Add Money</p>
            </div>
            <!-- card-2  -->
            <div id="cash-out-card"
              class="box border border-gray-500 p-3 flex flex-col items-center text-center rounded-lg shadow-lg hover:border-blue-600 hover:bg-white hover:shadow-xl transition duration-300 cursor-pointer"
            >
              <img class="w-8" src="assets/send1.png" alt="" />
              <p class="text-sm">Cash Out</p>
            </div>
            <!-- card-3  -->
            <div id="pay-bill-card"
              class="box border border-gray-500 p-3 flex flex-col items-center text-center rounded-lg shadow-lg hover:border-blue-600 hover:bg-white hover:shadow-xl transition duration-300 cursor-pointer"
            >
              <img class="w-8" src="assets/money1.png" alt="" />
              <p class="text-sm">Transfer Money</p>
            </div>
            <!-- card-4  -->
            <div
              class="box border border-gray-500 p-3 flex flex-col items-center text-center rounded-lg shadow-lg hover:border-blue-600 hover:bg-white hover:shadow-xl transition duration-300 cursor-pointer"
            >
              <img class="w-8" src="assets/bonus1.png" alt="" />
              <p class="text-sm">Get Bonus</p>
            </div>
            <!-- card-5  -->
            <div
              class="box border border-gray-500 p-3 flex flex-col items-center text-center rounded-lg shadow-lg hover:border-blue-600 hover:bg-white hover:shadow-xl transition duration-300 cursor-pointer"
            >
              <img class="w-8" src="assets/wallet1.png" alt="" />
              <p class="text-sm">Pay Bill</p>
            </div>
            <!-- card-6  -->
            <div
              class="box border border-gray-500 p-3 flex flex-col items-center text-center rounded-lg shadow-lg hover:border-blue-600 hover:bg-white hover:shadow-xl transition duration-300 cursor-pointer"
            >
              <img class="w-8" src="assets/transaction1.png" alt="" />
              <p class="text-sm">Transactions</p>
            </div>
          </div>
        </section>
        <!-- Add money Section -->
        <section id="add-money" class="mt-8">
          <h1 class="font-bold md:text-xl">Add Money</h1>
          <div class="bg-white w-full max-w-md rounded-xl p-6 mt-6">
            <form>
              <!-- Select Bank -->
              <div>
                <label for=""
                  ><span class="font-semibold text-sm"
                    >Select A Bank</span
                  ></label
                >
                <select
                  name=""
                  id=""
                  class="mt-2 w-full border border-gray-300 rounded-2xl px-3 py-2 focus:outline-none focus:ring-1 focus:ring-blue-600 mb-2"
                >
                  <option disabled selected>Select your bank</option>
                  <option value="DBBL">DBBL</option>
                  <option value="bKash">bKash</option>
                  <option value="Nagad">Nagad</option>
                  <option value="Rocket">Rocket</option>
                </select>
              </div>
              <!-- Bank Account Number -->
              <div>
                <label for=""
                  ><span class="font-semibold text-sm"
                    >Bank Account Number</span
                  ></label
                >
                <input
                  type="text"
                  name=""
                  id="account-number"
                  placeholder="Enter 11 digit account number"
                  class="mt-2 w-full border border-gray-300 rounded-2xl px-3 py-2 focus:outline-none focus:ring-1 focus:ring-blue-600 mb-2"
                />
              </div>
              <!-- Amount to Add -->
              <div>
                <label for=""
                  ><span class="font-semibold text-sm"
                    >Amount to Add</span
                  ></label
                >
                <input
                  type="text"
                  name=""
                  id="amount"
                  placeholder="Add Amount to withdraw"
                  class="mt-2 w-full border border-gray-300 rounded-2xl px-3 py-2 focus:outline-none focus:ring-1 focus:ring-blue-600 mb-2"
                />
              </div>
              <div>
                <label for=""
                  ><span class="font-semibold text-sm">Pin Number</span></label
                >
                <input
                  type="password"
                  name=""
                  id="pin"
                  placeholder="Enter 4 digit pin number"
                  class="mt-2 w-full border border-gray-300 rounded-2xl px-3 py-2 focus:outline-none focus:ring-1 focus:ring-blue-600 mb-2"
                />
              </div>
              <!-- add money btn -->
              <button id="add-money-btn"
                class="bg-blue-700 text-white font-semibold w-full my-3 py-2 rounded-2xl border-2 border-blue-600 hover:border-blue-700 hover:bg-transparent hover:text-blue-800 hover:font-bold"
              >
                Add Money
              </button>
            </form>
          </div>
        </section>


        <!--Cash Out Section -->
        <section id="cash-out" class="mt-8">
          <h1 class="font-bold md:text-xl">Cash Out</h1>
          <div class="bg-white w-full max-w-md rounded-xl p-6 mt-6">
            <form>
              <!-- Select Bank -->
              <div>
                <label for=""
                  ><span class="font-semibold text-sm"
                    >Select A Bank</span
                  ></label
                >
                <select
                  name=""
                  id=""
                  class="mt-2 w-full border border-gray-300 rounded-2xl px-3 py-2 focus:outline-none focus:ring-1 focus:ring-blue-600 mb-2"
                >
                  <option disabled selected>Select your bank</option>
                  <option value="DBBL">DBBL</option>
                  <option value="bKash">bKash</option>
                  <option value="Nagad">Nagad</option>
                  <option value="Rocket">Rocket</option>
                </select>
              </div>
              <!-- Bank Account Number -->
              <div>
                <label for=""
                  ><span class="font-semibold text-sm"
                    >Agent Number</span
                  ></label
                >
                <input
                  type="text"
                  name=""
                  id=""
                  placeholder="Enter 11 digit account number"
                  class="mt-2 w-full border border-gray-300 rounded-2xl px-3 py-2 focus:outline-none focus:ring-1 focus:ring-blue-600 mb-2"
                />
              </div>
              <!-- Amount  -->
              <div>
                <label for=""
                  ><span class="font-semibold text-sm"
                    >Amount</span
                  ></label
                >
                <input
                  type="text"
                  name=""
                  id="agent-amount"
                  placeholder="Enter Amount to withdraw"
                  class="mt-2 w-full border border-gray-300 rounded-2xl px-3 py-2 focus:outline-none focus:ring-1 focus:ring-blue-600 mb-2"
                />
              </div>
              <div>
                <label for=""
                  ><span class="font-semibold text-sm">Pin Number</span></label
                >
                <input
                  type="password"
                  name=""
                  id="cash-out-pin"
                  placeholder="Enter 4 digit pin number"
                  class="mt-2 w-full border border-gray-300 rounded-2xl px-3 py-2 focus:outline-none focus:ring-1 focus:ring-blue-600 mb-2"
                />
              </div>
              <!-- cash Out btn -->
              <button id="cash-out-btn"
                class="bg-blue-700 text-white font-semibold w-full my-3 py-2 rounded-2xl border-2 border-blue-600 hover:border-blue-700 hover:bg-transparent hover:text-blue-800 hover:font-bold"
              >
                Cash Out
              </button>
            </form>
          </div>
        </section>

      </header>
    </section>
    <script src="addMoney.js"></script>
    <script src="toggle.js"></script>
    <script src="cashOut.js"></script>
  </body>
</html>
