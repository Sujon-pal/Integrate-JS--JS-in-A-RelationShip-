<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- DaisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@3/dist/full.css"
      rel="stylesheet"
      type="text/css"
    />
  </head>

  <body class="bg-slate-900 min-h-screen">
    <!-- Main Section -->
    <section class="max-w-md min-h-screen mx-auto py-6 bg-slate-200">
      
      <!-- Header -->
      <header>
        <nav class="flex items-center justify-center mt-12">
          <div
            class="relative flex items-center justify-center
            mt-20 sm:mt-28 lg:mt-12 w-9/12"
          >
            <img class="w-40 sm:w-48 absolute" src="assets/bg.png" alt="" />
            <img class="w-10 sm:w-15 z-10"src="assets/Group.png" alt="" />
          </div>
        </nav>
      </header>

      <!-- Login Section -->
      <section class="mt-4 flex justify-center items-center px-6 sm:px-12">
        <div class="bg-white w-full max-w-md rounded-xl shadow-lg p-6">
          <form>
            <!-- Acount Number -->
            <div class="mb-4">
              <label class="label">
                <span class="text-black font-semibold">Acount Number</span>
              </label>
              <input 
              id="acount-num"
                type="text"
                required
                placeholder="Enter acount number"
                class="bg-slate-200 text-black rounded-3xl py-2 px-4
                placeholder:text-sm w-full
                focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>

            <!-- PIN -->
            <div class="mb-5">
              <label class="label">
                <span class="text-black font-semibold text-sm">
                  4 Digit Pin
                </span>
              </label>
              <input
                type="password"
               id="pin"
                required
                placeholder="Enter 4 Digit Pin"
                class="bg-slate-200 text-black rounded-3xl py-2 px-4
                placeholder:text-sm w-full
                focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>

            <!-- Button -->
            <button id="login-btn"
              class="mt-4 w-full rounded-3xl py-2
              bg-blue-600 text-white border-2 border-blue-600
              hover:bg-transparent hover:text-blue-600
              hover:font-semibold transition duration-300"
            >
              Login
            </button>
          </form>
        </div>
      </section>
    </section>

    <script src="login.js"></script>
  </body>
</html>
