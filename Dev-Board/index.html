<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- DaisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@3/dist/full.css"
      rel="stylesheet"
      type="text/css"
    />

  </head>
  <body class="md:px-20 md:py-4 px-2 bg-slate-100 overflow-x-hidden">
    <!-- Header Section -->
    <header class="bg-white lg:py-2 px-3 rounded-2xl py-4">
      <div class="flex items-center justify-between">
        <!-- Right Side Logo -->
        <div class="flex items-center gap-2">
          <img class="lg:w-12 w-9" src="assets/logo.png" alt="" />
          <h1 class="text-2xl font-bold text-primary">DevBoard</h1>
        </div>
        <!-- left Side Logo -->
        <div class="flex items-center gap-7">
          <div
            class="flex items-center gap-2 bg-slate-200 px-3 py-1 rounded-2xl"
          >
            <img class="w-5" src="assets/checkbox.png" alt="" />
            <samp class="font-bold text-xl">23</samp>
          </div>
          <img src="assets/theme-btn.png" alt="" />
        </div>
      </div>
    </header>
    <main class="mt-5">
      <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        <!-- Left Section -->
        <div class="lg:col-span-3 bg-white lg:p-3 rounded-lg">
          <!-- Top Cards -->
          <div class="grid grid-cols-1 md:grid-cols-4 lg:gap-6 gap-2">
            <!-- card -1  -->
            <div
              class="flex items-center justify-between px-5 py-5 rounded-2xl bg-gray-300"
            >
              <img
                class="w-10 rounded-full bg-white p-1"
                src="assets/checkbox.png"
                alt=""
              />
              <div>
                <p class="text-sm text-gray-600">Task Assigned</p>
                <span class="font-bold">00</span>
              </div>
            </div>
            <!-- card - 2 -->
            <div
              class="flex items-center gap-4 bg-gradient-to-bl to-blue-800 from-blue-300 rounded-2xl lg:col-span-2 lg:p-6 p-3 text-white"
            >
              <img src="assets/board.png" alt="" class="w-12" />
              <p class="font-semibold text-lg">Discover Something New Today!</p>
            </div>
            <!-- card -3  -->
            <div
              class="flex items-center justify-between px-5 py-5 rounded-2xl bg-gray-300"
            >
              <div class="rounded-full bg-white">
                <img class="w-10 p-2" src="assets/calender.png" alt="" />
              </div>

              <div>
                <p id="day" class="text-sm text-gray-600">---</p>
                <span id="date" class="font-bold">---</span>
                <p id="time" class="text-sm text-gray-600"></p>
              </div>
            </div>
          </div>

        </div>
      </div>
    </main>
    <script src="script/time.js"></script>
  </body>
</html>
